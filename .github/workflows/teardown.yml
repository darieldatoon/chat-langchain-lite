name: Teardown

# Deletes everything the demo created in the LangSmith workspace, deployments included.
# The repo, its settings and Pages stay; the run lists what to remove by hand.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "teardown" to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: demo-state
  cancel-in-progress: false

jobs:
  teardown:
    if: inputs.confirm == 'teardown'
    environment: maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - run: sfw pnpm install --frozen-lockfile
      - run: mise run demo:uninstall -- --yes

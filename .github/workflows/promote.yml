name: Promote

# Keeps one open "development → main" PR; merging it promotes to production.
# Needs Settings → Actions → "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [development]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-list --count origin/main..origin/development 2>/dev/null || echo 1)" = "0" ]; then
            echo "development has nothing new for main."
            exit 0
          fi
          existing=$(gh pr list --base main --head development --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base main --head development \
              --title "Promote development → main" \
              --body "Merging this deploys the changes on \`development\` to the production agent and Pages site."
          else
            echo "PR #$existing already tracks development."
          fi
